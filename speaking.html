<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPT 口說練習</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Microsoft JhengHei', 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
    }

    .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
    }

    .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px;
        text-align: center;
    }

    .header h1 { font-size: 2.2em; margin-bottom: 8px; }
    .header p { opacity: 0.9; }

    .content { padding: 30px 40px 40px; }

    .browser-warning {
        display: none;
        background: #fff3cd;
        border-left: 4px solid #ffc107;
        color: #856404;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        line-height: 1.6;
    }
    .browser-warning.show { display: block; }

    .level-tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
        flex-wrap: wrap;
    }

    .level-tab {
        flex: 1;
        min-width: 100px;
        padding: 12px;
        text-align: center;
        border-radius: 10px;
        border: 2px solid #e0e0e0;
        background: white;
        cursor: pointer;
        font-weight: bold;
        color: #666;
        transition: all 0.2s;
    }

    .level-tab.active {
        border-color: #667eea;
        background: #667eea;
        color: white;
    }

    .progress-line {
        text-align: center;
        color: #888;
        margin-bottom: 20px;
        font-size: 0.95em;
    }

    .sentence-card {
        background: #f8f9fa;
        border-radius: 15px;
        padding: 30px;
        border-left: 5px solid #667eea;
        margin-bottom: 25px;
    }

    .sentence-text {
        font-size: 1.5em;
        color: #2d3748;
        line-height: 1.6;
        margin-bottom: 10px;
    }

    .sentence-translation {
        color: #718096;
        font-size: 1em;
    }

    .action-row {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-bottom: 25px;
        flex-wrap: wrap;
    }

    .action-btn {
        padding: 14px 28px;
        border: none;
        border-radius: 50px;
        font-size: 1.05em;
        font-weight: bold;
        cursor: pointer;
        color: white;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .action-btn:hover { transform: scale(1.05); }
    .action-btn:disabled { background: #ccc !important; cursor: not-allowed; transform: none; }

    .btn-listen { background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%); }
    .btn-record { background: linear-gradient(135deg, #48bb78 0%, #38a169 100%); }
    .btn-record.recording { background: linear-gradient(135deg, #f56565 0%, #c53030 100%); animation: pulse 1s infinite; }
    .btn-next { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
    }

    .result-box {
        display: none;
        background: #f0f4ff;
        border-radius: 12px;
        padding: 20px 25px;
        margin-bottom: 20px;
    }
    .result-box.show { display: block; }

    .result-score {
        font-size: 1.3em;
        font-weight: bold;
        margin-bottom: 12px;
        color: #2d3748;
    }

    .result-diff {
        font-size: 1.15em;
        line-height: 1.8;
        margin-bottom: 10px;
    }

    .word-ok {
        color: #22543d;
        background: #c6f6d5;
        padding: 2px 6px;
        border-radius: 6px;
        margin: 2px;
        display: inline-block;
    }

    .word-miss {
        color: #c53030;
        background: #fed7d7;
        padding: 2px 6px;
        border-radius: 6px;
        margin: 2px;
        display: inline-block;
        text-decoration: line-through;
    }

    .result-transcript {
        color: #718096;
        font-size: 0.95em;
        font-style: italic;
    }

    .result-feedback {
        margin-top: 10px;
        font-weight: bold;
        color: #4a5568;
    }

    .stats-bar {
        display: flex;
        justify-content: space-around;
        background: #f7fafc;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 20px;
        text-align: center;
    }

    .stats-bar .stat-label { font-size: 0.8em; color: #a0aec0; }
    .stats-bar .stat-value { font-size: 1.3em; font-weight: bold; color: #2d3748; }

    @media (max-width: 600px) {
        .content { padding: 20px; }
        .sentence-text { font-size: 1.2em; }
        .action-btn { padding: 12px 20px; font-size: 0.95em; }
    }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎤 GEPT 口說練習</h1>
        <p>用瀏覽器內建的語音功能，練習朗讀並即時看發音精準度</p>
    </div>

    <div class="content">
        <div class="browser-warning" id="browserWarning">
            ⚠️ 偵測到你的瀏覽器不支援語音辨識（建議使用電腦版 Chrome 或 Edge）。你仍然可以使用「播放例句」聽發音，但無法使用「開始朗讀」錄音評分功能。
        </div>

        <div class="stats-bar">
            <div>
                <div class="stat-label">已練習句數</div>
                <div class="stat-value" id="statCount">0</div>
            </div>
            <div>
                <div class="stat-label">平均精準度</div>
                <div class="stat-value" id="statAvg">—</div>
            </div>
        </div>

        <div class="level-tabs" id="levelTabs">
            <div class="level-tab active" data-level="elementary">📘 初級</div>
            <div class="level-tab" data-level="intermediate">📗 中級</div>
            <div class="level-tab" data-level="high">📕 中高級</div>
        </div>

        <div class="progress-line" id="progressLine">第 1 句／共 6 句</div>

        <div class="sentence-card">
            <div class="sentence-text" id="sentenceText">Loading...</div>
            <div class="sentence-translation" id="sentenceTranslation"></div>
        </div>

        <div class="action-row">
            <button class="action-btn btn-listen" id="listenBtn">🔊 播放例句</button>
            <button class="action-btn btn-record" id="recordBtn">🎤 開始朗讀</button>
            <button class="action-btn btn-next" id="nextBtn">➡️ 下一句</button>
        </div>

        <div class="result-box" id="resultBox">
            <div class="result-score" id="resultScore"></div>
            <div class="result-diff" id="resultDiff"></div>
            <div class="result-transcript" id="resultTranscript"></div>
            <div class="result-feedback" id="resultFeedback"></div>
        </div>
    </div>
</div>

<script src="data.js"></script>
<script>
(function () {
    // 口說練習句庫：優先沿用 data.js 的 GEPT_QUESTIONS（把克漏字空格換成正確答案組成完整例句），
    // 若 data.js 沒有一起載入（例如這個檔案被單獨拿去別的地方用），則退回內建的備用例句。
    const FALLBACK_ITEMS = [
        { level: 'elementary', text: 'I go to school by bus every day.', translation: '我每天搭公車去學校。' },
        { level: 'elementary', text: 'She finished her homework yesterday.', translation: '她昨天完成了她的作業。' },
        { level: 'elementary', text: 'Can you lend me your pencil, please?', translation: '你可以借我你的鉛筆嗎？' },
        { level: 'elementary', text: 'My grandmother is very kind to everyone.', translation: '我奶奶對每個人都很親切。' },
        { level: 'elementary', text: 'There are many students in the classroom.', translation: '教室裡有很多學生。' },
        { level: 'elementary', text: "Could you close the door? It's cold in here.", translation: '你可以關門嗎？這裡好冷。' },

        { level: 'intermediate', text: 'The manager was very generous when she praised the team.', translation: '經理在讚揚團隊時非常大方。' },
        { level: 'intermediate', text: 'We had to postpone our trip because of heavy traffic.', translation: '因為交通繁忙，我們不得不推遲行程。' },
        { level: 'intermediate', text: 'Her doctor suggested that she get more exercise.', translation: '她的醫生建議她多運動。' },
        { level: 'intermediate', text: 'The new employee seems very reliable and hardworking.', translation: '這位新員工看起來非常可靠又努力。' },
        { level: 'intermediate', text: 'The museum offers a variety of activities for children.', translation: '博物館為兒童提供各種各樣的活動。' },
        { level: 'intermediate', text: 'If I had more time, I would travel around the world.', translation: '如果我有更多時間，我就會環遊世界。' },

        { level: 'high', text: 'The government has implemented several initiatives to reduce pollution.', translation: '政府已經實施了幾項措施來減少污染。' },
        { level: 'high', text: "The professor's lecture was so compelling that students were inspired.", translation: '教授的演講非常引人入勝，激勵了學生。' },
        { level: 'high', text: 'Climate change poses a significant threat to biodiversity.', translation: '氣候變化對生物多樣性構成重大威脅。' },
        { level: 'high', text: 'The committee will evaluate all proposals before deciding.', translation: '委員會將在做決定前評估所有提案。' },
        { level: 'high', text: 'The economic crisis had a devastating impact on small businesses.', translation: '經濟危機對小型企業造成了毀滅性的影響。' },
        { level: 'high', text: 'The documentary provided valuable insights into endangered species.', translation: '這部紀錄片提供了對瀕危物種的寶貴見解。' }
    ];

    const SPEAKING_ITEMS = (typeof GEPT_QUESTIONS !== 'undefined' && GEPT_QUESTIONS.length)
        ? GEPT_QUESTIONS.map(q => ({
            level: q.level,
            text: q.question.replace('___', q.options[q.answer]).replace(/\s+([;,.!?])/g, '$1'),
            translation: q.translation
        }))
        : FALLBACK_ITEMS;

    const STORAGE_KEY = 'geptSpeakingProgress';

    let currentLevel = 'elementary';
    let currentIndex = 0;
    let pool = [];
    let recognition = null;
    let recognizing = false;

    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
    const speechSupported = !!SpeechRecognitionCtor;
    const synthSupported = 'speechSynthesis' in window;

    const el = {
        warning: document.getElementById('browserWarning'),
        tabs: document.getElementById('levelTabs'),
        progressLine: document.getElementById('progressLine'),
        sentenceText: document.getElementById('sentenceText'),
        sentenceTranslation: document.getElementById('sentenceTranslation'),
        listenBtn: document.getElementById('listenBtn'),
        recordBtn: document.getElementById('recordBtn'),
        nextBtn: document.getElementById('nextBtn'),
        resultBox: document.getElementById('resultBox'),
        resultScore: document.getElementById('resultScore'),
        resultDiff: document.getElementById('resultDiff'),
        resultTranscript: document.getElementById('resultTranscript'),
        resultFeedback: document.getElementById('resultFeedback'),
        statCount: document.getElementById('statCount'),
        statAvg: document.getElementById('statAvg')
    };

    function normalize(str) {
        return str.toLowerCase().replace(/[^a-z0-9\s']/g, '').trim();
    }

    function tokenize(str) {
        return normalize(str).split(/\s+/).filter(Boolean);
    }

    // 用最長共同子序列（LCS）比對，找出學生唸對的字詞並計算精準度
    function scoreAttempt(target, spoken) {
        const t = tokenize(target);
        const s = tokenize(spoken);
        const dp = Array.from({ length: t.length + 1 }, () => new Array(s.length + 1).fill(0));

        for (let i = 1; i <= t.length; i++) {
            for (let j = 1; j <= s.length; j++) {
                if (t[i - 1] === s[j - 1]) {
                    dp[i][j] = dp[i - 1][j - 1] + 1;
                } else {
                    dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                }
            }
        }

        let i = t.length, j = s.length;
        const matched = new Array(t.length).fill(false);
        while (i > 0 && j > 0) {
            if (t[i - 1] === s[j - 1]) {
                matched[i - 1] = true;
                i--; j--;
            } else if (dp[i - 1][j] >= dp[i][j - 1]) {
                i--;
            } else {
                j--;
            }
        }

        const matchCount = dp[t.length][s.length];
        const accuracy = t.length ? Math.round((matchCount / t.length) * 100) : 0;
        return { words: t, matched, accuracy };
    }

    function feedbackFor(accuracy) {
        if (accuracy >= 90) return '太棒了！發音非常標準！🌟';
        if (accuracy >= 75) return '很好！大部分都念對了，繼續保持！👏';
        if (accuracy >= 50) return '還不錯，再多練習幾次會更好！💪';
        return '別灰心，先聽一次示範發音，再試一次！📖';
    }

    function loadPool(level) {
        pool = SPEAKING_ITEMS.filter(item => item.level === level);
        currentIndex = 0;
    }

    function renderSentence() {
        const item = pool[currentIndex];
        el.sentenceText.textContent = item.text;
        el.sentenceTranslation.textContent = item.translation;
        el.progressLine.textContent = `第 ${currentIndex + 1} 句／共 ${pool.length} 句`;
        el.resultBox.classList.remove('show');
    }

    function speak(text) {
        if (!synthSupported) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }

    function saveAttempt(level, accuracy) {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        data.push({ timestamp: new Date().toISOString(), level, accuracy });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        renderStats();
    }

    function renderStats() {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        el.statCount.textContent = data.length;
        if (data.length) {
            const avg = Math.round(data.reduce((s, a) => s + a.accuracy, 0) / data.length);
            el.statAvg.textContent = avg + '%';
        } else {
            el.statAvg.textContent = '—';
        }
    }

    function showResult(target, transcript) {
        const result = scoreAttempt(target, transcript);

        el.resultScore.textContent = `精準度：${result.accuracy}%`;
        el.resultDiff.innerHTML = result.words.map((w, idx) =>
            `<span class="${result.matched[idx] ? 'word-ok' : 'word-miss'}">${w}</span>`
        ).join(' ');
        el.resultTranscript.textContent = `你說的是：「${transcript}」`;
        el.resultFeedback.textContent = feedbackFor(result.accuracy);
        el.resultBox.classList.add('show');

        saveAttempt(currentLevel, result.accuracy);
    }

    function setupRecognition() {
        if (!speechSupported) return;
        recognition = new SpeechRecognitionCtor();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = function () {
            recognizing = true;
            el.recordBtn.textContent = '⏹ 錄音中...';
            el.recordBtn.classList.add('recording');
        };

        recognition.onend = function () {
            recognizing = false;
            el.recordBtn.textContent = '🎤 開始朗讀';
            el.recordBtn.classList.remove('recording');
        };

        recognition.onerror = function (event) {
            recognizing = false;
            el.recordBtn.textContent = '🎤 開始朗讀';
            el.recordBtn.classList.remove('recording');
            if (event.error === 'not-allowed' || event.error === 'permission-denied') {
                alert('無法使用麥克風，請確認瀏覽器有允許這個網站使用麥克風權限。');
            } else if (event.error === 'no-speech') {
                alert('沒有偵測到語音，請再試一次。');
            }
        };

        recognition.onresult = function (event) {
            const transcript = event.results[0][0].transcript;
            const item = pool[currentIndex];
            showResult(item.text, transcript);
        };
    }

    el.tabs.addEventListener('click', function (e) {
        const tab = e.target.closest('.level-tab');
        if (!tab) return;
        document.querySelectorAll('.level-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentLevel = tab.getAttribute('data-level');
        loadPool(currentLevel);
        renderSentence();
    });

    el.listenBtn.addEventListener('click', function () {
        speak(pool[currentIndex].text);
    });

    el.recordBtn.addEventListener('click', function () {
        if (!speechSupported) return;
        if (recognizing) {
            recognition.stop();
            return;
        }
        recognition.start();
    });

    el.nextBtn.addEventListener('click', function () {
        currentIndex = (currentIndex + 1) % pool.length;
        renderSentence();
    });

    if (!speechSupported) {
        el.warning.classList.add('show');
        el.recordBtn.disabled = true;
    } else {
        setupRecognition();
    }
    if (!synthSupported) {
        el.listenBtn.disabled = true;
    }

    loadPool(currentLevel);
    renderSentence();
    renderStats();
})();
</script>
</body>
</html>
